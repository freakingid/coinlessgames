    else queueDir({x:0, y: dy>0?1:-1});
    ptr.ax = p.x; ptr.ay = p.y;
  }
  e.preventDefault && e.preventDefault();
}
function onPointerUp(e){
  if (!ptr.down || e.pointerId !== ptr.id) return;
  ptr.down = false;
  const p = toGame(e);
  if (ptr.moved <= CONFIG.feel.tapMaxPx){
    handleTap(p.x, p.y);
  }
  e.preventDefault && e.preventDefault();
}
function inRect(x, y, r){ return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }

function handleTap(x, y){
  if (MODE === 'menu'){
    // Checked before the tap-anywhere-to-start fallback, so tapping the button
    // toggles fullscreen instead of launching a run.
    if (fullscreenSupported() && inRect(x, y, FS_BTN)){ toggleFullscreen(); SFX.uiTap(); return; }
    confirmAction(); return;
  }
  if (MODE === 'playing'){
    if (inRect(x, y, PAUSE_BTN)) togglePause();
    return;
  }
  if (MODE === 'paused'){
    for (const b of pauseMenuBtns){
      if (inRect(x, y, b)){
        if (b.id === 'resume') togglePause();
        else if (b.id === 'sound') toggleSound();
        else if (b.id === 'fullscreen'){ toggleFullscreen(); SFX.uiTap(); }   // stays paused
        else if (b.id === 'restart'){ startRun(); SFX.uiTap(); }
        return;
      }
    }
    return;
  }
  confirmAction();   // gameover / victory
}

/* ---------------------------------------------------------------
   15. LOOP / BOOT
   --------------------------------------------------------------- */
const STEP = 1/60;          // fixed simulation timestep
let acc = 0, lastT = 0;

function frame(now){
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps++ < 6){ simulate(STEP); acc -= STEP; }
  if (steps >= 6) acc = 0;   // spiral-of-death guard: drop backlog
  render();
  requestAnimationFrame(frame);
}

/* ---- Fullscreen ----------------------------------------------------------
   Chrome for Android has no F11, so the game exposes its own toggle. Two rules
   drive this code:
     1. requestFullscreen() only works when called synchronously from a user
        gesture, so toggleFullscreen() is ONLY ever reached from the tap or
        keydown handlers — never from the render loop or a timer.
     2. We expand #wrap (the flex-centering container), not the canvas. If the
        canvas itself went fullscreen the browser would stretch it edge to edge
        and fight fitCanvas(); expanding the container instead just gives
        fitCanvas() a bigger window to letterbox into, so the aspect ratio and
        all input mapping stay exactly as they are windowed.
   Everything is feature-detected and wrapped: on a platform that refuses (or
   an iPhone, where element fullscreen doesn't exist) the buttons simply never
   appear and the game plays as before. */
function fsTarget(){
  return wrapEl || canvas || null;
}
function fullscreenSupported(){
  if (!CONFIG.fullscreen.enabled) return false;
  const el = fsTarget();
  return !!(el && (el.requestFullscreen || el.webkitRequestFullscreen));
}
function isFullscreen(){
  if (typeof document === 'undefined') return false;
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen(){
  if (!fullscreenSupported()) return;
  const el = fsTarget();
  try {
    if (isFullscreen()){
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit){ const p = exit.call(document); if (p && p.catch) p.catch(()=>{}); }
    } else {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      // navigationUI is a hint; browsers that don't know it ignore the argument.
      const p = req.call(el, { navigationUI: CONFIG.fullscreen.navigationUI });
      if (p && p.catch) p.catch(()=>{});   // refusal must never throw into the loop
    }
  } catch (_){ /* unsupported or blocked: stay windowed, no harm done */ }
}


// is crisp at native density. Input still maps through CSS px (see toGame), so no
// coordinate assumptions change — the whole scene just draws at higher resolution.
function fitCanvas(){
  const winW = (typeof window !== 'undefined' && window.innerWidth)  || D.width;
  const winH = (typeof window !== 'undefined' && window.innerHeight) || D.height;
  const rawDpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
  const dpr = Math.max(1, Math.min(rawDpr, D.dprCap));
  const scale = Math.min(winW / D.width, winH / D.height);
  const cssW = Math.max(1, Math.floor(D.width  * scale));
  const cssH = Math.max(1, Math.floor(D.height * scale));
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const bw = Math.max(1, Math.round(cssW * dpr));
  const bh = Math.max(1, Math.round(cssH * dpr));
  if (canvas.width !== bw || canvas.height !== bh){ canvas.width = bw; canvas.height = bh; }
  view.sx = canvas.width  / D.width;
  view.sy = canvas.height / D.height;
  view.cssW = cssW; view.cssH = cssH; view.dpr = dpr;
}

/* On resize / rotate / DPR change / fullscreen transition:

   - On the MENU we re-shape the grid to the new window (a phone rotated to
     landscape should start its next run on a landscape arena), then refit.
   - During a run — playing, paused, or frozen on a tally card — we only refit.
     Re-shaping mid-run would leave entities outside the arena and would change
     the geometry a seeded run was reproducing, so a mid-run resize is purely a
     re-letterbox; the new shape is picked up by the next startRun(). */
function onResize(){
  if (MODE === 'menu') reshapeToWindow();
  fitCanvas();
  drawBgLayer(bgWaveN, bgObstacles);
}

function boot(){
  canvas = document.getElementById('game');
  wrapEl = document.getElementById(CONFIG.fullscreen.targetId) || canvas;
  ctx = canvas.getContext('2d');
  reshapeToWindow(true);      // resolve the grid for this device BEFORE anything reads D
  fitCanvas();                // then the view + device-pixel backing store
  // menu needs a background before the first run exists
  S = newRun();               // throwaway state so drawBgLayer/obstacles have context
  runSeed = 12345;
  rng = mulberry32(runSeed);
  genObstacles(1);
  drawBgLayer(0, S.obstacles, 'menu');
  S = null;

  window.addEventListener('resize', onResize);
  // Entering/leaving fullscreen changes the viewport: refit and repaint the arena.
  // Most browsers also fire 'resize' here, but not all do it reliably on Android.
  document.addEventListener('fullscreenchange', onResize);
  document.addEventListener('webkitfullscreenchange', onResize);
  window.addEventListener('keydown', onKeyDown);
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  document.addEventListener('visibilitychange', ()=>{ if (document.hidden && MODE === 'playing') setMode('paused'); });
  window.addEventListener('blur', ()=>{ if (MODE === 'playing') setMode('paused'); });

  lastT = (typeof performance !== 'undefined' ? performance.now() : 0);
  requestAnimationFrame(frame);
}

/* Debug / test hooks. The headless harness (and curious tinkerers) drive the
   game through window.__PP without touching the DOM or rAF. Harmless to ship. */
window.__PP = {
  CONFIG, D,
  get mode(){ return MODE; },
  get S(){ return S; },
  get view(){ return view; },
  get pauseBtn(){ return PAUSE_BTN; },
  get pauseBtns(){ return pauseMenuBtns; },
  get fsBtn(){ return FS_BTN; },
  get hud(){ return HUD; },
  get grid(){ return gridFromConfig(); },
  startRun,
  simulate,
  render,
  queueDir,
  setSeed(n){ CONFIG.debug.seed = n; },
  /* Grid control for tests and console tinkering. setGridFor(devW, devH) applies
     the grid a device of that shape would resolve to, regardless of autoGrid —
     and pinning it (autoGrid:false) is what makes a seeded run reproducible, since
     determinism only holds at a fixed geometry. */
  resolveGrid, applyGrid, reshapeToWindow, densityScale, arenaTiles,
  setGridFor(devW, devH){ applyGrid(resolveGrid(devW, devH)); return gridFromConfig(); },
  pinGrid(on){ CONFIG.display.autoGrid = !on; },
  key(k){ onKeyDown({ key: k, preventDefault(){} }); },   // drive the keyboard path
  tap(x, y){ handleTap(x, y); },                            // drive the pointer-tap path
  confirmAction, togglePause, toggleSound, fitCanvas,
  toggleFullscreen, isFullscreen, fullscreenSupported,
  spawnEnemyAt(type, x, y){ S.enemies.push(makeEnemy(type, x, y)); },
  dazeAll(){ for (const e of S.enemies) if (e.state === 'active') dazeEnemy(e); },
  damageMember, dazeEnemy, spawnPickup,
  helpers: { waveQuota, waveSpawnInterval, waveMaxActive, enemyHpFor, enemySpeedFor, tileCX, tileCY, blocked, inRect },
};

boot();
</script>
</body>
</html>
